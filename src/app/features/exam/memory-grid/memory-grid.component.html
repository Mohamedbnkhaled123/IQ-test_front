<div
  class="memory-grid"
  [style.grid-template-columns]="'repeat(' + cols() + ', minmax(0, 1fr))'"
>
  @for (cellIdx of cellIndices(); track cellIdx) {
    <button
      type="button"
      class="grid-cell"
      [class.selected]="selectedCellIndex() === cellIdx"
      (click)="selectCell(cellIdx)"
    >
      مربع {{ cellIdx + 1 }}
    </button>
  }
</div>
